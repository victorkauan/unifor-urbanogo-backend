name: urbanogo-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: urbanogo
      POSTGRES_PASSWORD: urbanogo
      POSTGRES_DB: urbanogo
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanogo -d urbanogo"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
    # a API roda no host (npm run dev), não neste Compose
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # URL de webhook (Slack, Discord, etc.) pro canal do time. Sem isso, os
      # alertas ainda funcionam, só não notificam ninguém.
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-https://example.invalid/configure-alert-webhook-url}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  db_data:
