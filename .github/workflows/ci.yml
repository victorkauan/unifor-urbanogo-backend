name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, test, build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://urbanogo:urbanogo@localhost:5432/urbanogo?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-not-a-real-credential
      RUN_DB_TESTS: "1"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: urbanogo
          POSTGRES_PASSWORD: urbanogo
          POSTGRES_DB: urbanogo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urbanogo -d urbanogo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npx prisma migrate deploy

      - run: npm test
